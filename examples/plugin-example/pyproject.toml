[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fmk-example-plugin"
version = "0.1.0"
description = "Example step plugin for feishu-minutes-kit."
requires-python = ">=3.10"
dependencies = ["feishu-minutes-kit"]

[project.entry-points."fmk.steps"]
wordcount = "fmk_example_plugin:WordCountStep"

[tool.hatch.build.targets.wheel]
packages = ["src/fmk_example_plugin"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "feishu-minutes-kit"
version = "0.1.0"
description = "Turn Feishu Minutes recordings into a searchable local Markdown archive."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "feishu-minutes-kit contributors" }]
keywords = ["feishu", "lark", "minutes", "transcription", "asr", "markdown"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[project.scripts]
fmk = "fmk.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/feishu-minutes-kit"
Issues = "https://github.com/OWNER/feishu-minutes-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fmk"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "README.zh-CN.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["fmk"]

[tool.mypy]
python_version = "3.10"
files = ["src/fmk"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[tool.coverage.run]
source = ["fmk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
